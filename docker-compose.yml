services:
  message-pusher:
    build:
      context: ..
      dockerfile: dotnet/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TZ=Asia/Shanghai
      - AppSettings__SessionSecret=${SESSION_SECRET:-please-change-me}
      - Database__Provider=sqlite
      - Database__SqlitePath=/data/message-pusher.db
    volumes:
      - ./data:/data
